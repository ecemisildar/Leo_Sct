# image_processor:
#   ros__parameters:
#     # Depth-based obstacle detection tuning for RealSense
#     # Conservative real-world profile: detect earlier, clear later.
#     enter_thresh: 0.50
#     exit_thresh: 0.90
#     emergency_thresh: 0.40
#     # Side ROIs: increased to react earlier to walls/objects on left/right.
#     side_enter_thresh: 0.80
#     side_exit_thresh: 0.95
#     left_enter_thresh: 0.80
#     right_enter_thresh: 0.80
#     left_exit_thresh: 0.95
#     right_exit_thresh: 0.95

#     # Depth range in meters
#     min_depth: 0.20
#     max_depth: 6.00

#     # ROI / robustness tuning (conservative)
#     stride: 1
#     percentile: 0.05
#     near_count_k: 4
#     valid_count_min: 60
#     crop_y0_frac: 0.25
#     crop_y1_frac: 0.55
#     front_gain: 1.40

#     # Stability / responsiveness (conservative)
#     hold_ms: 250
#     clear_skip: 1
#     safe_frames_required: 5

#     # ArUco tracking tuning
#     aruco_enabled: true
#     aruco_debug: false
#     rgb_topic: "camera/camera/color/image_raw"
#     aruco_dictionary_id: 1  # DICT_4X4_100
#     aruco_target_id: 1
#     # Keep detection "true" briefly through occasional missed frames.
#     aruco_seen_hold_ms: 1500
#     aruco_missed_frames_threshold: 6
#     aruco_min_marker_perimeter_px: 80.0
#     aruco_center_tolerance: 0.18
#     # Side-sensitive steering: classify LEFT/RIGHT earlier.
#     aruco_center_tolerance: 0.16
#     # Improve side-angle/small marker detection robustness.
#     aruco_min_marker_perimeter_rate: 0.015
#     aruco_max_marker_perimeter_rate: 4.0
#     aruco_adaptive_thresh_win_min: 3
#     aruco_adaptive_thresh_win_max: 43
#     aruco_adaptive_thresh_win_step: 4

#     # RGB color detection tuning. Raise color_min_area_ratio or disable purple
#     # if background/lighting is incorrectly classified as purple.
#     green_detection_enabled: true
#     purple_detection_enabled: true
#     color_detect_hold_ms: 800
#     green_detect_hold_ms: 1500
#     purple_detect_hold_ms: 800
#     image_view_enabled: true
#     save_green_images: true
#     green_image_save_dir: "/tmp/leo_green_detections"
#     color_debug_log: false
#     color_min_area_ratio: 0.01
#     color_saturation_min: 50
#     color_value_min: 60
#     color_roi_y0_frac: 0.25
#     color_roi_y1_frac: 0.85
#     green_min_area_ratio: 0.008
#     green_saturation_min: 45
#     green_value_min: 50
#     green_hue_min: 36
#     green_hue_max: 88
#     purple_min_area_ratio: 0.02
#     purple_saturation_min: 40
#     purple_value_min: 40
#     purple_hue_min: 125
#     purple_hue_max: 165

image_processor_rgb:
  ros__parameters:
    enter_thresh: 0.50
    exit_thresh: 0.90
    emergency_thresh: 0.40
    side_enter_thresh: 0.80
    side_exit_thresh: 0.95
    left_enter_thresh: 0.45
    right_enter_thresh: 0.45
    left_exit_thresh: 0.65
    right_exit_thresh: 0.65
    min_depth: 0.20
    max_depth: 6.00
    stride: 1
    percentile: 0.10
    near_count_k: 20
    valid_count_min: 60
    crop_y0_frac: 0.25
    crop_y1_frac: 0.55
    front_gain: 1.40
    hold_ms: 250
    clear_skip: 1
    safe_frames_required: 5
    ignore_color_for_zones: true
    rgb_topic: "camera/camera/color/image_raw"
    green_detection_enabled: true
    purple_detection_enabled: true
    color_detect_hold_ms: 100
    green_detect_hold_ms: 1500
    purple_detect_hold_ms: 100
    image_view_enabled: true
    save_green_images: true
    green_image_save_dir: "/tmp/leo_green_detections"
    color_debug_log: false
    color_min_area_ratio: 0.01
    color_saturation_min: 50
    color_value_min: 60
    color_roi_y0_frac: 0.25
    color_roi_y1_frac: 0.85
    green_crop_y0_frac: 0.45
    green_crop_y1_frac: 0.85
    green_min_area_ratio: 0.01
    green_saturation_min: 50
    green_value_min: 60
    green_hue_min: 35
    green_hue_max: 85
    purple_min_area_ratio: 0.02
    purple_saturation_min: 40
    purple_value_min: 40
    purple_hue_min: 125
    purple_hue_max: 165
